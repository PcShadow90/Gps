name: MotoGPS backend check

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: npm run check
