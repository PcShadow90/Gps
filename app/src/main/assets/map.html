<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}#mode{position:absolute;z-index:9999;top:10px;left:10px;background:#111;color:#fff;padding:8px;border-radius:8px;font:14px sans-serif}</style></head><body><div id="mode">Moto • Navegação</div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let map=L.map('map').setView([40.2,-8.42],12),user=null,route=null;
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
function setUser(lat,lon){if(user)map.removeLayer(user);user=L.marker([lat,lon]).addTo(map).bindPopup('A sua posição');map.setView([lat,lon],14);}
function setMode(m){document.getElementById('mode').innerText='Moto • '+(m==='curves'?'Mais curvas':m==='no_tolls'?'Sem portagens':'Navegação');}
async function searchDestination(q){if(!user)return;const g=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q)).then(r=>r.json());if(!g.length)return;const a=g[0],s=user.getLatLng();const u='https://router.project-osrm.org/route/v1/driving/'+s.lng+','+s.lat+';'+a.lon+','+a.lat+'?overview=full&geometries=geojson';const d=await fetch(u).then(r=>r.json());if(!d.routes?.length)return;if(route)map.removeLayer(route);route=L.geoJSON(d.routes[0].geometry,{style:{weight:6}}).addTo(map);map.fitBounds(route.getBounds(),{padding:[30,30]});window.AndroidVoice?.speak('Rota calculada. '+Math.round(d.routes[0].distance/1000)+' quilómetros.');}
</script></body></html>
