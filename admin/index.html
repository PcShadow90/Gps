<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotoGPS Admin</title><style>body{font-family:system-ui;margin:0;background:#101010;color:#eee}header{padding:24px;background:#171717}main{padding:24px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.card{background:#1d1d1d;border:1px solid #333;border-radius:14px;padding:20px}.n{font-size:32px;font-weight:700}.muted{color:#aaa}</style></head><body><header><h1>MotoGPS — Administração</h1><div class="muted">Monitorização da API e módulos da plataforma</div></header><main><div class="card"><div class="muted">API</div><div id="api" class="n">...</div></div><div class="card"><div class="muted">Alertas</div><div id="reports" class="n">...</div></div><div class="card"><div class="muted">POIs</div><div id="pois" class="n">...</div></div><div class="card"><div class="muted">Grupos</div><div id="groups" class="n">...</div></div></main><script>async function load(){for(const [id,a] of [['api','health'],['reports','reports'],['pois','pois'],['groups','groups']]){try{const r=await fetch('/api/motogps?action='+a);const d=await r.json();document.getElementById(id).textContent=a==='health'?(d.ok?'ONLINE':'OFFLINE'):d.length}catch(e){document.getElementById(id).textContent='ERRO'}}}load()</script></body></html>
